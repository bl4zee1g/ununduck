# /etc/nginx/sites/ununduck (or conf.d/ununduck.conf)
# nginx only terminates TLS and proxies to the Bun server on 127.0.0.1:1338.
# It needs no access to the home directory.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name search.example.com;

    ssl_certificate     /etc/ssl/search.example.com/fullchain.pem;
    ssl_certificate_key /etc/ssl/search.example.com/privkey.pem;

    gzip on;
    gzip_proxied any;
    gzip_types application/json application/javascript;

    location / {
        proxy_pass http://127.0.0.1:1338;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name search.example.com;
    return 301 https://$host$request_uri;
}
